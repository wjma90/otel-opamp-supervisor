name: Supervisor verify and release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*

concurrency:
  group: supervisor-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CHART_DIR: charts/o11y-opamp-supervisor
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

jobs:
  verify:
    name: Validate wrapper and Helm chart
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Resolve and validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          chart_version="$(awk '$1 == "version:" {gsub(/\"/, "", $2); print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          chart_app_version="$(awk '$1 == "appVersion:" {gsub(/\"/, "", $2); print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          image_tag="$(awk '$1 == "tag:" {gsub(/\"/, "", $2); print $2; exit}' "${CHART_DIR}/values.yaml")"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be semantic x.y.z" >&2
            exit 1
          fi
          if [[ "${chart_version}" != "${version}" ||
                "${chart_app_version}" != "${version}" ||
                "${image_tag}" != "${version}" ]]; then
            echo "VERSION, Chart version/appVersion and default image tag must match" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "release tag must be v${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate shell and render contract
        shell: bash
        run: |
          set -euo pipefail
          sh -n otelcol-contrib-wrapper.sh
          "${CHART_DIR}/tests/render.sh"

      - name: Package chart without publishing
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "${CHART_DIR}" \
            --destination dist \
            --version "${VERSION}" \
            --app-version "${VERSION}"
          helm show chart "dist/o11y-opamp-supervisor-${VERSION}.tgz"

      - name: Upload verified chart
        uses: actions/upload-artifact@v4
        with:
          name: o11y-opamp-supervisor-chart-${{ steps.metadata.outputs.version }}
          path: dist/o11y-opamp-supervisor-${{ steps.metadata.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 14

  build-scan:
    name: Build and scan linux/${{ matrix.arch }}
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build one architecture for verification
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "linux/${ARCH}" \
            --load \
            --tag "o11y-opamp-supervisor:ci-${ARCH}" \
            .

      - name: Smoke the embedded Collector wrapper
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "linux/${ARCH}" \
            --entrypoint /usr/local/bin/otelcol-contrib-wrapper \
            "o11y-opamp-supervisor:ci-${ARCH}" \
            --version

          docker run --rm \
            --platform "linux/${ARCH}" \
            --env O11Y_COLLECTOR_FEATURE_GATES=exporter.prometheusremotewritexporter.RetryOn429 \
            --volume "${PWD}/${CHART_DIR}/collector-base/base.yaml:/tmp/base.yaml:ro" \
            --entrypoint /usr/local/bin/otelcol-contrib-wrapper \
            "o11y-opamp-supervisor:ci-${ARCH}" \
            validate --config=/tmp/base.yaml

          if docker run --rm \
            --platform "linux/${ARCH}" \
            --env 'O11Y_COLLECTOR_FEATURE_GATES=invalid;argument' \
            --entrypoint /usr/local/bin/otelcol-contrib-wrapper \
            "o11y-opamp-supervisor:ci-${ARCH}" \
            --version; then
            echo "wrapper accepted an unsafe feature-gate value" >&2
            exit 1
          fi

      - name: Scan image with pinned Trivy
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports trivy-cache
          mounts=(
            -v /var/run/docker.sock:/var/run/docker.sock
            -v "${PWD}/reports:/reports"
            -v "${PWD}/trivy-cache:/root/.cache/trivy"
          )
          image="o11y-opamp-supervisor:ci-${ARCH}"
          docker run --rm "${mounts[@]}" "${TRIVY_IMAGE}" \
            image --platform "linux/${ARCH}" \
              --scanners vuln,secret,misconfig \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --format json \
              --output "/reports/supervisor-linux-${ARCH}.json" \
              "${image}"
          docker run --rm "${mounts[@]}" "${TRIVY_IMAGE}" \
            image --platform "linux/${ARCH}" \
              --scanners vuln,secret,misconfig \
              --severity CRITICAL \
              --exit-code 1 \
              "${image}"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-trivy-linux-${{ matrix.arch }}
          path: reports/supervisor-linux-${{ matrix.arch }}.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish image and Helm OCI chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify
      - build-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve GHCR names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "chart_registry=oci://ghcr.io/${owner}/charts" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${owner}/o11y-opamp-supervisor" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR for images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Log in to GHCR for Helm
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | \
            helm registry login ghcr.io \
              --username "${GHCR_OWNER}" \
              --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-architecture image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=supervisor-release
          cache-to: type=gha,mode=max,scope=supervisor-release
          provenance: mode=max
          sbom: true

      - name: Package and publish chart to Helm OCI
        env:
          CHART_REGISTRY: ${{ steps.names.outputs.chart_registry }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "${CHART_DIR}" \
            --destination dist \
            --version "${VERSION}" \
            --app-version "${VERSION}"
          helm push \
            "dist/o11y-opamp-supervisor-${VERSION}.tgz" \
            "${CHART_REGISTRY}"

      - name: Publish summary
        env:
          CHART_REGISTRY: ${{ steps.names.outputs.chart_registry }}
          IMAGE: ${{ steps.names.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          {
            echo "## O11y OpAMP Supervisor ${VERSION}"
            echo
            echo "- Image: \`${IMAGE}@${IMAGE_DIGEST}\`"
            echo "- Chart: \`${CHART_REGISTRY}/o11y-opamp-supervisor:${VERSION}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- BuildKit SBOM and provenance: enabled"
          } >> "${GITHUB_STEP_SUMMARY}"

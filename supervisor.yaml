server:
  endpoint: http://control-plane:4320/v1/opamp
  headers:
    X-Service-Name: compose-collector-supervisor
    X-O11y-Cluster: compose-local
    X-O11y-Collector-Role: all-in-one
    X-O11y-Managed-By: opamp-supervisor
    X-O11y-Supervisor-Version: "0.5.5"
    X-O11y-Collector-Version: "0.156.0"
    X-O11y-Base-Config-ID: collector-base.compose
    X-O11y-Base-Config-Source: bind-mount:charts/o11y-opamp-supervisor/collector-base/base.yaml
    X-O11y-Base-Config-Revision: "1"
    X-O11y-Base-Config-Default: "true"
    X-O11y-Base-Config-Managed-By: local-file
    X-O11y-Transport: http-poll
    X-O11y-Poll-Interval-Seconds: "10"
    X-O11y-OpAMP-Endpoint: http://control-plane:4320/v1/opamp
capabilities:
  reports_effective_config: true
  reports_health: true
  accepts_remote_config: true
  reports_remote_config: true
  reports_heartbeat: true
agent:
  executable: /usr/local/bin/otelcol-contrib-wrapper
  passthrough_logs: true
  config_files:
    - /etc/otelcol/base.yaml
  startup_fallback_configs:
    - /etc/otelcol/base.yaml
  validate_config: true
storage:
  directory: /tmp/opamp
healthcheck:
  endpoint: 0.0.0.0:13134
telemetry:
  logs:
    level: warn
    encoding: console
